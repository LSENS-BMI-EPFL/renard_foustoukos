[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-learning"
version = "0.1.0"
description = "Analysis code for Renard, Foustoukos et al. (eLife, 2026): rapid cortical reorganization tracks goal-directed sensorimotor learning."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Anthony Renard" },
    { name = "Georgios Foustoukos" },
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13.2",
    "xarray>=2024.6",
    "netCDF4>=1.7",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "joblib>=1.4",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "pymc>=5.16",
    "pynwb>=2.8",
    "cicada-nwb @ git+https://gitlab.com/cossartlab/cicada_nwb.git@abfbfc0512b7b5cf621161156e57088f65eb9278",
    "cicada-analysis @ git+https://gitlab.com/cossartlab/cicada_analysis.git@ad285182ad2a93ca27ff48fd1f664bb7fd027fe3",
]

[project.optional-dependencies]
# Upstream steps (raw imaging -> dF/F); not needed to reproduce the figures.
preprocessing = ["suite2p", "tifffile", "scanimage-tiff-reader"]
# Projection-neuron labelling GUI.
gui = ["PyQt5", "pyqtgraph", "SimpleITK-SimpleElastix", "opencv-python", "scikit-image"]
dev = ["ruff", "pytest"]

[project.urls]
Article = "https://doi.org/10.7554/eLife.111818.1"
Preprint = "https://www.biorxiv.org/content/10.64898/2026.05.11.724293v1"
Repository = "https://github.com/LSENS-BMI-EPFL/renard_foustoukos"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fast_learning*"]

[tool.ruff]
line-length = 110
extend-exclude = ["exploratory", "pipeline/upstream"]

[tool.ruff.lint]
# Pyflakes (undefined names, unused imports...) and pycodestyle errors.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E731",  # lambda assignments are used for short, local helpers
    "F841",  # unused names often hold calls with side effects (plt.figure, PyMC model terms)
]

[tool.ruff.lint.per-file-ignores]
# Star imports of the plotting palettes are kept for backward compatibility.
"src/fast_learning/behavior.py" = ["F401", "F403", "F405"]
"pipeline/extra/*" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]
